name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this? Be as specific as possible.
      placeholder: |
        1. Open Catallaxy
        2. Navigate to...
        3. Click...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Catallaxy version
      description: Found in the About dialog (Catallaxy menu > About)
      placeholder: "0.60.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: macOS version
      description: Apple menu > About This Mac
      placeholder: "macOS 26.0 Tahoe"
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >-
        Screenshots, error messages, or anything else that might help.
        Especially useful: attach your log file — in Catallaxy, choose
        Session > Reveal Logs and drag catallaxy.log into this field.
        Note: This issue tracker is public: the log names the project folders
        Catallaxy watched, so look through it first and leave out anything
        you wouldn't post publicly.
    validations:
      required: false
